name: Test game logic

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run engine tests
        run: node tests/engine.test.js
      - name: Validate unified runtime architecture
        run: node tests/runtime-architecture.test.js
      - name: Validate app runtime state ownership
        run: node tests/app-runtime-ownership.test.js
      - name: Validate runtime notification deduplication
        run: node tests/runtime-notifications.test.js
      - name: Validate scheduled event rollback
        run: node tests/scheduled-event-rollback.test.js
      - name: Validate Monday core requirement
        run: node tests/monday-requirement.test.js
      - name: Validate base story graph
        run: node tests/story-validation.test.js
      - name: Validate fully extended story graph
        run: node tests/expanded-story-validation.test.js
      - name: Validate complete five-day routes
        run: node tests/full-playthroughs.test.js
      - name: Validate save continuation across days
        run: node tests/save-resume-days.test.js
      - name: Validate Friday ending coverage
        run: node tests/ending-coverage.test.js
      - name: Test hidden choice rules
        run: node tests/rules-extension.test.js
      - name: Validate save integrity repairs
        run: node tests/integrity-fixes.test.js
      - name: Validate deterministic reset
        run: node tests/reset-integrity.test.js
      - name: Validate atomic persistence guards
        run: node tests/persistence-guards.test.js
      - name: Validate workday time boundaries
        run: node tests/time-boundary.test.js
      - name: Validate runtime asset references
        run: node tests/asset-integrity.test.js
      - name: Validate browser UI contract
        run: node tests/ui-contract.test.js
      - name: Validate runtime UI guards
        run: node tests/runtime-ui-guards.test.js
      - name: Validate event-driven UI lifecycle
        run: node tests/event-driven-ui.test.js
      - name: Validate exclusive app startup
        run: node tests/bootstrap-guard.test.js
      - name: Validate desktop icon presentation
        run: node tests/desktop-icons.test.js
      - name: Validate full-size resizable windows
        run: node tests/window-layout.test.js
      - name: Validate clean personal browser core
        run: node tests/personal-browser.test.js
      - name: Validate single-source browser UI v3
        run: node tests/personal-browser-ui-v3.test.js
      - name: Open Videotok directly from browser
        run: node tests/browser-videotok-open.test.js
      - name: Validate populated Kupitut marketplace
        run: node tests/marketplace-parody.test.js
      - name: Validate clean Videotok hosting
        run: node tests/videotok.test.js
      - name: Validate passive game clock
        run: node tests/passive-clock.test.js
      - name: Validate notification history
        run: node tests/notification-history.test.js
      - name: Validate day transition recovery
        run: node tests/day-transition.test.js
      - name: Validate reliable day end controls
        run: node tests/day-end-control.test.js
      - name: Validate Tuesday gameplay stage
        run: node tests/tuesday-stage.test.js
      - name: Validate Wednesday gameplay stage
        run: node tests/wednesday-stage.test.js
      - name: Validate Thursday gameplay stage
        run: node tests/thursday-stage.test.js
      - name: Validate Friday finale stage
        run: node tests/friday-stage.test.js
      - name: Validate interrupted Friday recovery
        run: node tests/friday-scene-guard.test.js
      - name: Validate Friday clock bypass guard
        run: node tests/friday-clock-guard.test.js
      - name: Validate Friday ending reopen
        run: node tests/friday-reopen.test.js
